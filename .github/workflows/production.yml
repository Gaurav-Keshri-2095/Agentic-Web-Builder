name: Production CI/CD Pipeline

# 1. THE TRIGGER
on:
  push:
    branches:
      - main

jobs:
  # 2. THE INTEGRATION PHASE (Testing)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Backend Pytest
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 
          python -m pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Frontend Vitest
        run: |
          cd frontend
          npm install
          npm run test

  # 3. THE DEPLOYMENT PHASE
  deploy:
    needs: test # This strictly prevents deployment if tests fail
    runs-on: ubuntu-latest
    steps:
      - name: SSH into DigitalOcean and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/repo
            git pull origin main
            docker compose up --build -d